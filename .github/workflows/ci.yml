name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Install without the [tokens] extra so the tiktoken-absent fallback path in
      # memo/tokens.py is what actually gets exercised here.
      - name: Install
        run: python -m pip install -e ".[dev]"

      # memo's own glyphs used to crash on a cp1252 pipe, which is exactly how an
      # agentic IDE captures our output. PYTHONIOENCODING is deliberately NOT set so
      # console.init_streams() is under test rather than papered over.
      - name: Tests
        run: python -m pytest -q

      - name: Smoke test the CLI through a pipe
        shell: bash
        run: |
          python -m memo.cli --version | cat
          python -m memo --version | cat
          python -m memo.cli guide | cat > /dev/null
          python -m memo.cli doctor | cat

      - name: Smoke test init end-to-end
        shell: bash
        run: |
          mkdir -p /tmp/probe/src
          printf '# House rules\n\nRun tests first.\n' > /tmp/probe/CLAUDE.md
          printf 'class A:\n    def go(self):\n        return self.helper()\n    def helper(self):\n        return 1\n' > /tmp/probe/src/a.py
          cd /tmp/probe
          python -m memo.cli init | cat
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f .cursor/rules/memo.mdc
          test -f .github/copilot-instructions.md
          grep -q '^# House rules' CLAUDE.md   # pre-existing content preserved
          grep -q '\.memo/' .gitignore
          python -m memo.cli status --json | cat
          # Re-running must be a true no-op.
          python -m memo.cli init --no-index | tee /tmp/rerun.txt | cat
          grep -q unchanged /tmp/rerun.txt
